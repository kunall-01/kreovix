
<!doctype html>
<html lang="en">
  <head> 
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Kreovix is a software development company building custom web applications, mobile apps, business software, AI solutions, MLM platforms, and blockchain applications."
    />

    <meta name="author" content="Kreovix" />

    <meta name="robots" content="index, follow" />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="theme-color"
      content="#60241E"
    />

    <!-- =========================
         TITLE
    ========================== -->

    <title>
      Kreovix | Software Development Company
    </title>

    <!-- =========================
         CANONICAL
         Replace with your real domain
    ========================== -->

    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- =========================
         FAVICON
    ========================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- =========================
         OPEN GRAPH / FACEBOOK / LINKEDIN
    ========================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Kreovix"
    />

    <meta
      property="og:title"
      content="Kreovix | Software Development Company"
    />

    <meta
      property="og:description"
      content="Custom web applications, mobile apps, business software, AI solutions, MLM platforms, and blockchain applications built by Kreovix."
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Kreovix — Software Development Company"
    />

    <!-- =========================
         TWITTER / X
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Kreovix | Software Development Company"
    />

    <meta
      name="twitter:description"
      content="Kreovix builds custom software, web applications, mobile apps, AI solutions, MLM platforms, and blockchain applications."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Kreovix — Software Development Company"
    />

    <!-- =========================
         PERFORMANCE
    ========================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- =========================
         STRUCTURED DATA
         Organization
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kreovix",
        "url": "https://YOUR-DOMAIN.com/",
        "logo": "https://YOUR-DOMAIN.com/logo.png",
        "description": "Kreovix is a software development company building custom web applications, mobile apps, business software, AI solutions, MLM platforms, and blockchain applications."
      }
    </script>

    <!-- =========================
         STRUCTURED DATA
         WebSite
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kreovix",
        "url": "https://YOUR-DOMAIN.com/"
      }
    </script>
    <link rel="stylesheet" href="/src/global.css" /> 
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
